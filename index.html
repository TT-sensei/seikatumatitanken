<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf5ed"><title>まちたんけん！</title><link rel="stylesheet" href="css/style.css"></head>

<main class="layout"><section class="map-panel"><div class="heading"><div><small>ぼうけんの まち</small><h1>みどりのまち</h1></div><span class="weather">☀️ はれ</span></div><p class="muted">気になる場所をタップして、町を探検しよう！</p>
